<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLOXESS — Energy Collection</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080a08;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

header {
  height: 85px;
  padding: 0 7%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #202420;
}

.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 5px;
}

.logo span {
  color: #91ff00;
}

.header-label {
  color: #777;
  font-size: 11px;
  letter-spacing: 3px;
}

.hero {
  min-height: 650px;
  padding: 65px 8%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 30px;
}

.tag {
  color: #91ff00;
  font-size: 12px;
  letter-spacing: 4px;
  margin-bottom: 25px;
}

h1 {
  font-size: clamp(42px, 6vw, 78px);
  line-height: 1;
  margin-bottom: 25px;
}

h1 span {
  color: #91ff00;
}

.description {
  max-width: 430px;
  color: #999;
  line-height: 1.8;
  font-size: 15px;
}

.product-number {
  color: #91ff00;
  margin-top: 35px;
  font-size: 13px;
  letter-spacing: 3px;
}

.buttons {
  display: flex;
  gap: 12px;
  margin-top: 25px;
}

.buttons button {
  background: transparent;
  color: #777;
  border: 1px solid #333;
  padding: 12px 20px;
  cursor: pointer;
  transition: .3s;
}

.buttons button.active,
.buttons button:hover {
  color: #91ff00;
  border-color: #91ff00;
}

.scene {
  width: 100%;
  height: 510px;
  position: relative;
}

.scene canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.collection {
  padding: 65px 8%;
  border-top: 1px solid #202420;
}

.section-title {
  font-size: 27px;
  margin-bottom: 35px;
}

.section-title span {
  color: #91ff00;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.card {
  background: #101310;
  border: 1px solid #252925;
  padding: 25px;
  cursor: pointer;
  transition: .3s;
}

.card:hover,
.card.active {
  border-color: #91ff00;
  transform: translateY(-5px);
}

.mini-can {
  height: 125px;
  width: 48px;
  margin: 0 auto 22px;
  border-radius: 9px;
  background: linear-gradient(90deg,#111,#444,#111);
  border: 2px solid #555;
  position: relative;
}

.mini-can::before {
  content: "M";
  position: absolute;
  top: 35px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 27px;
  font-weight: 900;
  color: var(--accent);
}

.card h3 {
  text-align: center;
  font-size: 15px;
}

.card p {
  text-align: center;
  color: #777;
  font-size: 12px;
  margin-top: 10px;
}

footer {
  border-top: 1px solid #202420;
  padding: 30px 8%;
  color: #666;
  font-size: 11px;
  letter-spacing: 2px;
}

max-width:750px {
  .hero {
    grid-template-columns: 1fr;
    padding: 45px 7%;
  }

  .scene {
    height: 390px;
  }

  .cards {
    grid-template-columns: 1fr;
  }

  header {
    padding: 0 7%;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">FLOX<span>ESS</span></div>
  <div class="header-label">ENERGY COLLECTION / 2026</div>
</header>

<section class="hero" id="home">

  <div class="info">
    <div class="tag">01 / ENERGY SERIES</div>

    <h1 id="productName">
      MONSTER
<span>ORIGINAL</span>
    </h1>

    <p class="description" id="productDescription">
      Классический чёрно-зелёный дизайн.
      Знаковый стиль оригинальной линейки.
    </p>

    <div class="product-number" id="number">
      01 / 03
    </div>

    <div class="buttons">
      <button class="active" data-index="0">01</button>
      <button data-index="1">02</button>
      <button data-index="2">03</button>
    </div>
  </div>

  <div class="scene" id="scene"></div>

</section>

<section class="collection">

  <h2 class="section-title">
    OUR <span>COLLECTION</span>
  </h2>

  <div class="cards">

    <div class="card active" data-index="0">
      <div class="mini-can" style="--accent:#91ff00"></div>


<h3>MONSTER ORIGINAL</h3>
      <p>Classic energy</p>
    </div>

    <div class="card" data-index="1">
      <div class="mini-can" style="--accent:#00aaff"></div>
      <h3>MONSTER ULTRA</h3>
      <p>Ultra series</p>
    </div>

    <div class="card" data-index="2">
      <div class="mini-can" style="--accent:#ff3434"></div>
      <h3>MONSTER RESERVE</h3>
      <p>Reserve series</p>
    </div>

  </div>
</section>

<footer>
  FLOXESS — ENERGY COLLECTION
</footer>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const container = document.getElementById('scene');

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  38,
  container.clientWidth / container.clientHeight,
  0.1,
  100
);

camera.position.set(0, 0.3, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true
});

renderer.setSize(
  container.clientWidth,
  container.clientHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;

container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.8));

const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(4, 5, 7);
scene.add(light);

const greenLight = new THREE.PointLight(0x91ff00, 30, 15);
greenLight.position.set(-3, 1, 3);
scene.add(greenLight);

const products = [
  {
    name: 'MONSTER ORIGINAL',
    color: '#91ff00',
    dark: '#080d08',
    description: 'Классический чёрно-зелёный дизайн. Знаковый стиль оригинальной линейки.'
  },
  {
    name: 'MONSTER ULTRA',
    color: '#00aaff',
    dark: '#101820',
    description: 'Серебристая эстетика с холодными голубыми акцентами.'
  },
  {
    name: 'MONSTER RESERVE',
    color: '#ff3434',
    dark: '#180b0b',
    description: 'Контрастный тёмный дизайн с насыщенными красными акцентами.'
  }
];

function makeTexture(product) {
  const canvas = document.createElement('canvas');
  canvas.width = 1024;
  canvas.height = 1024;

  const ctx = canvas.getContext('2d');

  const gradient = ctx.createLinearGradient(0, 0, 1024, 0);
  gradient.addColorStop(0, '#030303');
  gradient.addColorStop(.5, product.dark);
  gradient.addColorStop(1, '#030303');

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 1024, 1024);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 100px Arial';
  ctx.fillText('MONSTER', 512, 240);

  ctx.fillStyle = product.color;

  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(380 + i * 110, 320);
    ctx.lineTo(330 + i * 110, 690);
    ctx.lineTo(470 + i * 110, 520);
    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 85px Arial';
  ctx.fillText('ENERGY', 512, 820);

  ctx.font = 'bold 35px Arial';
  ctx.fillText('ENERGY DRINK', 512, 875);

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;

  return texture;
}

function createCan(product) {
  const group = new THREE.Group();

  const bodyMaterial = new THREE.MeshStandardMaterial({
    map: makeTexture(product),
    metalness: 0.55,
    roughness: 0.3
  });

  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(.75, .75, 3.3, 96, 1),
    bodyMaterial
  );

  group.add(body);

  const metal = new THREE.MeshStandardMaterial({
    color: 0xbfc3c5,
    metalness: 0.95,
    roughness: 0.2
  });

  const top = new THREE.Mesh(
    new THREE.CylinderGeometry(.73, .73, .12, 64),
    metal
  );

  top.position.y = 1.68;
  group.add(top);

  const bottom = new THREE.Mesh(
    new THREE.CylinderGeometry(.73, .73, .1, 64),
    metal
  );

  bottom.position.y = -1.68;
  group.add(bottom);

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(.67, .035, 12, 64),
    metal
  );

  ring.rotation.x = Math.PI / 2;
  ring.position.y = 1.75;
  gro

up.add(ring);

  const bottomRing = ring.clone();
  bottomRing.position.y = -1.73;
  group.add(bottomRing);

  return group;
}

const cans = products.map(product => {
  const can = createCan(product);
  scene.add(can);
  return can;
});

let selected = 0;

function selectProduct(index) {
  selected = index;

  const product = products[index];

  document.getElementById('productName').innerHTML =
    product.name.replace(' ', '
<span>') + '</span>';

  document.getElementById('productDescription').textContent =
    product.description;

  document.getElementById('number').textContent =
    `0${index + 1} / 03`;

  document.querySelectorAll('.buttons button').forEach((button, i) => {
    button.classList.toggle('active', i === index);
  });

  document.querySelectorAll('.card').forEach((card, i) => {
    card.classList.toggle('active', i === index);
  });
}

document.querySelectorAll('.buttons button').forEach((button, index) => {
  button.addEventListener('click', () => selectProduct(index));
});

document.querySelectorAll('.card').forEach((card, index) => {
  card.addEventListener('click', () => {
    selectProduct(index);
    document.getElementById('home').scrollIntoView({
      behavior: 'smooth'
    });
  });
});

function animate() {
  requestAnimationFrame(animate);

  cans.forEach((can, index) => {
    can.visible = index === selected;

    if (can.visible) {
      can.rotation.y += 0.008;
      can.rotation.x = Math.sin(Date.now() * 0.001) * 0.025;
    }
  });

  renderer.render(scene, camera);
}

selectProduct(0);
animate();

window.addEventListener('resize', () => {
  const width = container.clientWidth;
  const height = container.clientHeight;

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height);
});
</script>

</body>
</html>
